# CareerOS 特征目录（feature catalog）—— 字段元数据的唯一来源
# 对应答辩验收清单 M1-P0-3：定义输入列、禁用列、取值范围、显示名和 ID 口径。
# 依据：README 要求统一职业/技能 ID 并保留原始来源；方案 A4 要求字段元数据只有一个来源。
# 本文件声明的列名与 data/processed/ 下三张 CSV 的表头一一对应，
# 由 scripts/check_feature_catalog.py 校验（标准库实现，无需 PyYAML）。

version: "1.0.0"
dataset_version: "0.5.0"
contract_version: "V1.0"
owner: "高帅龙（M1 数据负责人）"
updated_at: "2026-11-26"
source: "O*NET 31.0（2026-08 发布）"

# ------------------------------------------------------------------
# 输入列：算法/后端可使用的成品表字段（列名必须与 CSV 表头完全一致）
# 每个字段：name / dtype / display / range / nullable / description
# ------------------------------------------------------------------
tables:
  occupations.csv:
    primary_key: occupation_id
    columns:
      - name: occupation_id
        dtype: str
        display: 职业ID
        id_policy: "OCC-ONET-<原始O*NET-SOC码>，字符串，保留点号"
        nullable: false
        description: 稳定唯一职业标识，不依赖中文显示名
      - name: name
        dtype: str
        display: 职业名称
        nullable: false
        description: O*NET 英文原始名；中文显示名由后端 reference 映射提供
      - name: description
        dtype: str
        display: 职业描述
        nullable: true
        description: O*NET 原文；缺失留空字符串
      - name: category
        dtype: str
        display: 职业类别
        range: ["Computer and Mathematical", "Business and Financial Operations"]
        nullable: false
        description: 23 个计算机数学类 + 5 个商业金融分析类
      - name: source
        dtype: str
        display: 数据来源
        range: ["ONET"]
        nullable: false
        description: 第一阶段固定取值 ONET
      - name: source_id
        dtype: str
        display: 原始来源ID
        nullable: false
        description: 原始 O*NET-SOC 码，用于回溯

  skills.csv:
    primary_key: skill_id
    columns:
      - name: skill_id
        dtype: str
        display: 技能ID
        id_policy: "SKILL-ONET-<原始Element ID>，字符串，保留点号"
        nullable: false
        description: 稳定唯一技能标识，不依赖中文显示名
      - name: name
        dtype: str
        display: 技能名称
        nullable: false
        description: O*NET 英文原始名；中文显示名由后端 reference 映射提供
      - name: category
        dtype: str
        display: 技能来源分组
        range: ["essential", "transferable"]
        nullable: false
        description: essential 10 种核心技能 / transferable 25 种可迁移技能
      - name: description
        dtype: str
        display: 技能描述
        nullable: true
        description: 本期全部留空（前端不做技能详情展示）
      - name: source
        dtype: str
        display: 数据来源
        range: ["ONET"]
        nullable: false
        description: 第一阶段固定取值 ONET
      - name: source_id
        dtype: str
        display: 原始来源ID
        nullable: false
        description: 原始 O*NET Element ID，用于回溯

  occupation_skills.csv:
    primary_key: [occupation_id, skill_id]
    columns:
      - name: occupation_id
        dtype: str
        display: 职业ID
        nullable: false
        description: 外键，指向 occupations.csv 的 occupation_id
      - name: skill_id
        dtype: str
        display: 技能ID
        nullable: false
        description: 外键，指向 skills.csv 的 skill_id
      - name: importance
        dtype: float
        display: 技能重要程度
        range: [3.00, 4.88]
        nullable: false
        description: O*NET 原始 IM（1~5）未归一化；归一化 (IM-1)/4 由算法层在内存执行
      - name: required_level
        dtype: int
        display: 职业要求等级
        range: [1, 3]
        nullable: false
        description: round(LV*4/7) 映射的 0~4 级；契约定义 0~4，本数据集实际值域 1~3

# ------------------------------------------------------------------
# 禁用列：明确不进入成品表的字段，避免各模块私自新增
# ------------------------------------------------------------------
forbidden_columns:
  - name: name_zh
    reason: 中文显示名由后端 reference 映射表提供，三表不新增中文字段
  - name: required_level_raw
    reason: LV 原始 0~7 刻度已由算法负责人收回，gap 计算不需原始刻度
  - name: match_score
    reason: 算法输出字段，与数据侧 importance 语义不同，不得直连本表 importance
  - name: occupation_name
    reason: 接口模型字段，由后端映射 name 得到，数据侧不新增
  - name: skill_name
    reason: 接口模型字段，由后端映射 name 得到，数据侧不新增

# ------------------------------------------------------------------
# 口径说明：取值来源与量表
# ------------------------------------------------------------------
policies:
  importance: "存 O*NET 原始 IM(1~5)；归一化 (IM-1)/4 由算法层执行（赵帝臣 A1）"
  required_level: "round(LV*4/7)：0→0,1→1,2→1,3→2,4→2,5→3,6→3,7→4（赵帝臣 A3）；实际值域 1~3"
  skill_level_scale: "0~4 五级：0 未掌握 / 1 基础概念 / 2 基础任务 / 3 独立常见任务 / 4 复杂任务熟练"
  encoding: "UTF-8 无 BOM、逗号分隔、LF 换行、首行表头、缺失留空字符串"
  id_rule: "统一 ID = 类型前缀(OCC-/SKILL-) + ONET- + 原始 ID；全程按字符串处理，不经 Excel"
  threshold: "关联表只保留 IM >= 3.0 且 IM/LV 双评分齐全的组合；不 0 填充、不做前 N 截断"
