name: debug-gate

# 临时诊断用：把 scripts/ci.py 的完整输出写进 Job Summary（公开可读，不需要日志权限）。
# 定位完失败点后删除本文件。
on:
  push:
    branches: ["feat/api-contract-v2"]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff mypy coverage
      - name: Run gate and capture
        run: |
          set +e
          python scripts/ci.py > gate.log 2>&1
          code=$?
          {
            echo "### ci.py exit=$code"
            echo '```'
            tail -n 200 gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
