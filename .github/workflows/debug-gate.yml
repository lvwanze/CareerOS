name: debug-gate

# 临时诊断用：逐步执行质量门的 4 个检查，把每步退出码与输出尾部发到 PR 评论。
# 定位完失败点后删除本文件。
on:
  push:
    branches: ["feat/api-contract-v2"]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff mypy coverage
      - name: Probe versions
        run: |
          {
            echo "<!-- ci-debug -->"
            echo "**版本**"
            echo '```'
            python -V
            python -m ruff --version
            python -m mypy --version
            python -m pytest --version
            python -m coverage --version | head -1
            echo '```'
          } >> probe.txt 2>&1
      - name: Run checks one by one
        run: |
          set +e
          {
            echo "**逐步结果**"
            echo '```'
            echo "### ruff"
            python -m ruff check backend scripts/ci.py 2>&1 | tail -30
            echo "RUFF_EXIT=${PIPESTATUS[0]}"
            echo
            echo "### mypy"
            python -m mypy backend/packages 2>&1 | tail -30
            echo "MYPY_EXIT=${PIPESTATUS[0]}"
            echo
            echo "### architecture"
            python -m pytest backend/tests/architecture -q 2>&1 | tail -40
            echo "ARCH_EXIT=${PIPESTATUS[0]}"
            echo
            echo "### pytest"
            python -m pytest backend/tests -q 2>&1 | tail -60
            echo "PYTEST_EXIT=${PIPESTATUS[0]}"
            echo '```'
          } >> probe.txt 2>&1
      - name: Publish to PR comment
        run: |
          head -c 60000 probe.txt > body.txt
          python -c "import json;t=open('body.txt',encoding='utf-8',errors='replace').read();open('payload.json','w',encoding='utf-8').write(json.dumps({'body':t}))"
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/18/comments" \
            -d @payload.json | head -c 300
